<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unheard</title>
<meta name="description" content="Finds artists you have never played, using your own Last.fm history.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b35d8'/%3E%3Ctext x='32' y='47' font-family='Arial Black,Arial' font-weight='900' font-size='42' text-anchor='middle' fill='%23ff8a2a'%3E0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: one column of work (setup, then modes and results) under a slim header; the big orange zero is the brand mark. */
:root {
  --bg: #f3f4f8;
  --surface: #ffffff;
  --line: #dfe2ec;
  --ink: #12131a;
  --muted: #5b5f6e;
  --cobalt: #1b35d8;
  --cobalt-ink: #ffffff;
  --cobalt-soft: #e6eaff;
  --zero: #ff8a2a;
  --zero-ink: #a84200;
  --bad: #b3261e;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0e18; --surface: #151929; --line: #262b40; --ink: #eef0f7; --muted: #a0a6bb;
    --cobalt: #5d76ff; --cobalt-ink: #0c0e18; --cobalt-soft: #1c2342; --zero: #ff9a45; --zero-ink: #ffb070; --bad: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0e18; --surface: #151929; --line: #262b40; --ink: #eef0f7; --muted: #a0a6bb;
  --cobalt: #5d76ff; --cobalt-ink: #0c0e18; --cobalt-soft: #1c2342; --zero: #ff9a45; --zero-ink: #ffb070; --bad: #ff8a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 400 16px/1.5 var(--body); padding-inline: 16px; padding-block: env(safe-area-inset-top, 0px) 48px; }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 28px; }
a { color: var(--cobalt); }
h1, h2, h3 { font-family: var(--display); line-height: 1.1; margin: 0; text-wrap: balance; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--zero); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

header.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 20px 4px; flex-wrap: wrap; }
.mark { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: .02em; }
.mark b { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; background: var(--cobalt); color: var(--zero); font-size: 24px; }
.top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 14px; display: inline-flex; gap: 8px; align-items: center; min-height: 40px; }
button.chip:hover { border-color: var(--cobalt); }

.hero { display: grid; grid-template-columns: auto 1fr; gap: 8px 28px; align-items: end; }
.hero .zero { font-family: var(--display); font-weight: 900; font-size: clamp(120px, 22vw, 220px); line-height: .8; color: var(--zero); letter-spacing: -.04em; }
.hero h1 { font-size: clamp(28px, 4.4vw, 46px); font-weight: 800; }
.hero p { margin: 12px 0 0; color: var(--muted); font-size: 18px; max-width: 58ch; }
@media (max-width: 640px) { .hero { grid-template-columns: 1fr; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }

label.f { display: grid; gap: 6px; font-weight: 600; font-size: 15px; }
label.f small { font-weight: 400; color: var(--muted); }
input[type=text], input[type=password], input[type=number], select {
  width: 100%; min-height: 48px; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--bg);
}
input:focus, select:focus { border-color: var(--cobalt); outline: none; }
.form { display: grid; gap: 16px; }
.btn { min-height: 52px; border: 0; border-radius: 14px; padding: 12px 22px; background: var(--cobalt); color: var(--cobalt-ink); font-weight: 600; font-size: 16px; }
.btn:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .55; cursor: progress; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.err { color: var(--bad); font-weight: 500; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

ol.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; counter-reset: s; }
ol.steps li { display: grid; grid-template-columns: 32px 1fr; gap: 12px; counter-increment: s; }
ol.steps li::before { content: counter(s); display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--cobalt-soft); color: var(--cobalt); font-weight: 600; }
ol.steps code { background: var(--bg); padding: 1px 6px; border-radius: 6px; font-size: 14px; }
.privacy { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 14px; font-size: 14px; color: var(--muted); }

.modes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .modes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mode { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 16px; padding: 16px; min-height: 96px; display: grid; align-content: start; gap: 4px; }
.mode strong { font-family: var(--display); font-weight: 800; font-size: 17px; }
.mode span { color: var(--muted); font-size: 14px; line-height: 1.35; }
.mode[aria-pressed="true"] { border-color: var(--cobalt); background: var(--cobalt-soft); }

.opts { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; }
.opts > * { flex: 1 1 200px; min-width: 0; }
.opts .btn { flex: 0 0 auto; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1.5px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 14px; min-height: 44px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.progress { display: grid; gap: 8px; }
.bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--cobalt); border-radius: 999px; transition: width .2s; }
.log { margin: 0; padding: 0; list-style: none; font-size: 14px; color: var(--muted); display: grid; gap: 2px; }
.log li.now { color: var(--ink); font-weight: 500; }

.res-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: end; }
.res-head .big { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.res-head .big b { font-family: var(--display); font-weight: 900; font-size: 56px; line-height: 1; }
.res-head .big em { font-style: normal; font-family: var(--display); font-weight: 800; font-size: 20px; }
.res-head .big .z { color: var(--zero); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { background: var(--cobalt-soft); color: var(--cobalt); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 500; }
.tablebox { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; padding: 10px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.a { font-weight: 600; }
td.r, th.r { text-align: right; }
td .sub { display: block; color: var(--muted); font-size: 13px; font-weight: 400; }
.zero-cell { font-family: var(--display); font-weight: 900; font-size: 20px; color: var(--zero-ink); }
.row-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.mini { border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 6px 10px; min-height: 40px; font-size: 13px; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.mini:hover { border-color: var(--cobalt); }
.note { font-size: 14px; color: var(--muted); }

.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .kpis { grid-template-columns: 1fr; } }
.kpi b { display: block; font-family: var(--display); font-weight: 800; font-size: 34px; }
.kpi span { color: var(--muted); font-size: 14px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 13px; padding: 6px 10px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -110%); }
.toplist { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.toplist li { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; position: relative; padding: 6px 10px; border-radius: 8px; overflow: hidden; }
.toplist li i { position: absolute; inset: 0 auto 0 0; background: var(--cobalt-soft); z-index: 0; border-radius: 8px; }
.toplist li span, .toplist li b { position: relative; z-index: 1; min-width: 0; overflow-wrap: anywhere; }
footer { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 18px; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="mark"><b aria-hidden="true">0</b>UNHEARD</div>
    <div class="top-actions">
      <button class="chip" id="userChip" hidden></button>
      <button class="chip" id="langBtn" aria-label="Language"></button>
    </div>
  </header>

  <!-- setup -->
  <section id="setup" hidden>
    <div class="hero">
      <div class="zero" aria-hidden="true">0</div>
      <div>
        <h1 data-t="heroTitle"></h1>
        <p data-t="heroSub"></p>
      </div>
    </div>
    <div class="grid2" style="margin-top: 28px">
      <form class="card form" id="setupForm" autocomplete="off">
        <h2 style="font-size: 22px" data-t="connect"></h2>
        <label class="f"><span data-t="userLabel"></span><small data-t="userHint"></small>
          <input type="text" id="userInput" required spellcheck="false" autocapitalize="off"></label>
        <label class="f"><span data-t="keyLabel"></span><small data-t="keyHint"></small>
          <input type="password" id="keyInput" required spellcheck="false" autocapitalize="off" maxlength="40"></label>
        <button class="btn" id="setupBtn" type="submit" data-t="start"></button>
        <p class="err" id="setupErr" role="alert" hidden></p>
        <p class="privacy" data-t="privacy"></p>
      </form>
      <div class="card">
        <h2 style="font-size: 22px; margin-bottom: 16px" data-t="howKey"></h2>
        <ol class="steps" id="keySteps"></ol>
      </div>
    </div>
  </section>

  <!-- history download -->
  <section id="loading" class="card" hidden>
    <div class="progress">
      <h2 style="font-size: 22px" id="loadTitle"></h2>
      <div class="bar"><i id="loadBar"></i></div>
      <p class="muted small num" id="loadText"></p>
      <p class="err" id="loadErr" role="alert" hidden></p>
      <div><button class="btn ghost" id="loadRetry" hidden data-t="retry"></button></div>
    </div>
  </section>

  <!-- main -->
  <section id="main" hidden style="display: grid; gap: 20px">
    <div class="modes" role="group" aria-label="Mode">
      <button class="mode" data-mode="discover"><strong data-t="mDiscover"></strong><span data-t="mDiscoverSub"></span></button>
      <button class="mode" data-mode="forgotten"><strong data-t="mForgotten"></strong><span data-t="mForgottenSub"></span></button>
      <button class="mode" data-mode="loved"><strong data-t="mLoved"></strong><span data-t="mLovedSub"></span></button>
      <button class="mode" data-mode="stats"><strong data-t="mStats"></strong><span data-t="mStatsSub"></span></button>
    </div>

    <div class="card" id="opts"></div>

    <div class="card" id="runBox" hidden>
      <div class="progress">
        <div class="bar"><i id="runBar"></i></div>
        <ul class="log" id="runLog" aria-live="polite"></ul>
        <div><button class="btn ghost" id="stopBtn" data-t="stop"></button></div>
      </div>
    </div>

    <div id="results"></div>
  </section>

  <footer>
    <span data-t="footer"></span>
    <a href="https://github.com/gobimans/unheard">github.com/gobimans/unheard</a>
  </footer>
</div>

const BASE = 'https://ws.audioscrobbler.com/2.0/';

async function api(method, params = {}, key = creds && creds.key) {

    if (cancelled) throw new Error('cancelled');

      const r = await fetch(BASE + '?' + q.toString());
      let data = null;
      try { data = await r.json(); } catch { data = null; }
      if (data && data.error) {
        const e = new LFError(data.error, data.message || '');
        if (FATAL.has(e.code)) throw e;
        last = e;
      } else if (data && r.ok) return data;
      else last = new Error('HTTP ' + r.status);
    } catch (e) {
      if (e instanceof LFError && FATAL.has(e.code)) throw e;

      last = e;

      const i = next++;
      out[i] = await fn(items[i], i);

}

/* ------------------------------------------------------------------ months */
const ym = d => `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`;

    if (label > end) break;

}
const K = s => `${creds.user.toLowerCase()}:${s}`;

let months = {}, meta = {}, tagsCache = {}, profile = null, userInfo = null;

async function loadHistory(onProgress) {
  months = (await idb.get(K('months'))) || {};
  meta = (await idb.get(K('meta'))) || {};
  userInfo = (await api('user.getinfo', { user: creds.user })).user;
  const reg = +userInfo.registered.unixtime, now = Math.floor(Date.now() / 1000);
  const ranges = monthRanges(reg, now);
  const todo = ranges.filter(([l]) => !(l in months) || (meta.last_refresh && l >= meta.last_refresh));
  onProgress(0, todo.length, ranges.length, !!Object.keys(months).length);
  const failed = [];
  let sinceSave = 0;
  await pmap(todo, async ([l, f, to]) => {
    try {
      const d = await api('user.getweeklyartistchart', { user: creds.user, from: f, to });
      const chart = {};
      for (const a of listify(d.weeklyartistchart && d.weeklyartistchart.artist)) chart[a.name] = +a.playcount;
      months[l] = chart;
      if (++sinceSave >= 24) { sinceSave = 0; await idb.set(K('months'), months); }
    } catch (e) { if (e.message === 'cancelled') throw e; failed.push(l); delete months[l]; }
  }, (d) => onProgress(d, todo.length, ranges.length));
  await idb.set(K('months'), months);

}

      if (i > ni - 12) last12.set(a, (last12.get(a) || 0) + n);
      if (i > ni - windowM) win.set(a, (win.get(a) || 0) + n);

const sumMap = m => { let s = 0; for (const v of m.values()) s += v; return s; };

/* ------------------------------------------------------------------ tags */
async function fetchTags(names, onStep) {

/* ------------------------------------------------------------------ profile */
async function buildProfile(step) {

  const mass = {};

/* ------------------------------------------------------------------ exclusions */
const exKey = () => 'excluded:' + creds.user.toLowerCase();
const excluded = () => creds ? store.get(exKey(), []) : [];

/* ------------------------------------------------------------------ discovery */

}

  cand.forEach(([n], i) => {
    const v = ver[i]; if (v.isNew !== true || rows.length >= needed) return;
    const b = bysrc.get(n); const src = b ? [...b.entries()].sort((x, y) => y[1] - x[1]).slice(0, 2).map(x => x[0]) : [];
    rows.push({ artist: v.artist, track: v.track, similar: src, listeners: lis.get(n) });
  });
  return { ...res, rows };
}

/* ------------------------------------------------------------------ forgotten, loved, stats */
function forgottenPool() {
  const first = nowIdx() - (P.forgotten_silence_months - 1);
  const totals = new Map(), last = new Map(), names = new Map(), inWin = new Set();
  for (const [l, chart] of Object.entries(months)) {
    const i = labelIdx(l);
    for (const [a, n] of Object.entries(chart)) {
      const k = a.toLowerCase(); if (!names.has(k)) names.set(k, a);
      if (i >= first) { inWin.add(k); continue; }
      totals.set(k, (totals.get(k) || 0) + n);
      if (!last.has(k) || last.get(k) < l) last.set(k, l);
    }
  }
  return [...totals.entries()].filter(([k, n]) => n >= P.forgotten_min_plays && !inWin.has(k))
    .map(([k, n]) => ({ artist: names.get(k), total: n, last: last.get(k) })).sort((a, b) => b.total - a.total);
}
async function userTopTracks() {
  const d = await call('user.gettoptracks', { user: creds.user, period: 'overall', limit: 1000 });
  const mine = new Map();
  for (const x of d ? listify(d.toptracks && d.toptracks.track) : []) { const k = norm(x.artist.name); if (!mine.has(k)) mine.set(k, []); mine.get(k).push([x.name, +x.playcount]); }
  return mine;
}
async function forgotten(opt, log, bar) {
  const exN = new Set(excluded().map(norm));
  const pool = forgottenPool().filter(r => !exN.has(norm(r.artist)));
  log(t('lgTopTracks'));
  const mine = await userTopTracks(); bar(.3);
  const sel = pool.slice(0, opt.count);
  const rows = await pmap(sel, async r => {
    const tr = mine.get(norm(r.artist));
    return { ...r, track: tr ? tr[0][0] : await pickTrack(r.artist) };
  }, (d, n) => bar(.3 + d / n * .7));
  return { mode: 'forgotten', pool: pool.length, rows };
}
async function loved(opt, log, bar) {
  const prof = await ensureProfile((m, f) => { if (m) log(m); if (f != null) bar(f * .4); });
  const { allt, last12 } = playTables(P.cluster_window_months);
  const exN = new Set(excluded().map(norm));
  const rw = prof.rw ?? .5, totA = sumMap(allt), totR = sumMap(last12) || 1;
  let pool = [...allt.keys()].filter(a => allt.get(a) >= (prof.loved || 0) && !exN.has(norm(a)));
  const bl = a => (1 - rw) * allt.get(a) / totA + rw * (last12.get(a) || 0) / totR;
  pool.sort((a, b) => bl(b) - bl(a));
  log(t('lgTags'));
  await fetchTags(pool.slice(0, 600), (d, n) => bar(.4 + d / n * .3));
  let sel = [], tagsUsed = null;
  if (opt.tags.length) {
    const words = new Set(opt.tags);
    sel = pool.filter(a => [...tagNames(a)].some(x => words.has(x)));
    if (sel.length < P.min_seeds) {
      const extra = new Set();
      for (const w of words) { const d = await call('tag.getsimilar', { tag: w }); for (const r of (d ? listify(d.similartags && d.similartags.tag) : []).slice(0, 6)) extra.add(String(r.name).toLowerCase()); }
      sel = [...new Set([...sel, ...pool.filter(a => [...tagNames(a)].some(x => extra.has(x)))])];
    }
    tagsUsed = opt.tags;
  }
  if (!sel.length) { const cl = new Set(prof.cluster || []); sel = pool.filter(a => !cl.size || [...tagNames(a)].some(x => cl.has(x))); if (!sel.length) sel = pool; tagsUsed = tagsUsed ? null : prof.cluster; }
  sel = sel.slice(0, opt.count);
  log(t('lgTopTracks'));
  const mine = await userTopTracks(); bar(.8);
  const rows = await pmap(sel, async a => {
    const tr = mine.get(norm(a));
    return { artist: a, track: tr ? tr[0][0] : await pickTrack(a), trackPlays: tr ? tr[0][1] : null, plays: allt.get(a) };
  }, (d, n) => bar(.8 + d / n * .2));
  return { mode: 'loved', tags: tagsUsed, fellBack: opt.tags.length && !tagsUsed, rows };
}

/* ------------------------------------------------------------------ UI */
const views = ['setup', 'loading', 'main'];
const show = v => views.forEach(x => { $('#' + x).hidden = x !== v; });
function paintText() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  $('#keySteps').innerHTML = T[lang].steps.map(s => `<li><div>${s}</div></li>`).join('');
  $('#langBtn').textContent = lang === 'ru' ? 'EN' : 'RU';
  if (creds) $('#userChip').innerHTML = `${esc(creds.user)} · <span class="muted">${esc(t('change'))}</span>`;
  renderOpts();
  if (lastResult) renderResult(lastResult);
}
$('#langBtn').addEventListener('click', () => { lang = lang === 'ru' ? 'en' : 'ru'; store.set('lang', lang); paintText(); });
$('#userChip').addEventListener('click', async () => {
  store.del('creds'); creds = null; profile = null; lastResult = null; $('#results').innerHTML = '';
  $('#userChip').hidden = true; show('setup');
});

$('#setupForm').addEventListener('submit', async e => {
  e.preventDefault();
  const user = $('#userInput').value.trim(), key = $('#keyInput').value.trim().toLowerCase();
  const err = $('#setupErr'); err.hidden = true;
  if (!/^[0-9a-f]{32}$/.test(key)) { err.textContent = t('errFormat'); err.hidden = false; return; }
  $('#setupBtn').disabled = true;
  try {
    const info = (await api('user.getinfo', { user }, key)).user;
    creds = { user: info.name || user, key }; store.set('creds', creds);
    await start();
  } catch (ex) {
    const c = ex && ex.code;
    err.textContent = c === 10 || c === 26 ? t('errKey') : c === 6 ? t('errUser') : c === 17 ? t('errPrivate') : t('errNet');
    err.hidden = false;
  } finally { $('#setupBtn').disabled = false; }
});

async function start() {
  $('#userChip').hidden = false; paintText();
  show('loading'); $('#loadErr').hidden = true; $('#loadRetry').hidden = true;
  cancelled = false;
  try {
    const failed = await loadHistory((d, n, total, refresh) => {
      $('#loadTitle').textContent = refresh || (n < total) ? t('loadRefresh') : t('loadTitle', total);
      $('#loadBar').style.width = (n ? d / n * 100 : 100) + '%';
      $('#loadText').textContent = t('loadText', d, n);
    });
    tagsCache = (await idb.get(K('tags'))) || {};
    profile = (await idb.get(K('profile'))) || null;
    if (failed.length) { $('#loadErr').textContent = t('loadFail', failed.length); $('#loadErr').hidden = false; $('#loadRetry').hidden = false; return; }
    show('main'); renderOpts();
  } catch (ex) {
    const c = ex && ex.code;
    $('#loadErr').textContent = c === 10 || c === 26 ? t('errKey') : c === 17 ? t('errPrivate') : t('errNet');
    $('#loadErr').hidden = false; $('#loadRetry').hidden = false;
  }
}
$('#loadRetry').addEventListener('click', start);

let mode = store.get('mode', 'discover'), kind = 'none', lastResult = null, running = false;
document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => { mode = b.dataset.mode; store.set('mode', mode); lastResult = null; $('#results').innerHTML = ''; renderOpts(); }));

function renderOpts() {
  document.querySelectorAll('.mode').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
  const box = $('#opts');
  const countSel = `<label class="f" style="flex: 0 1 180px"><span>${esc(t('count'))}</span><select id="optCount">${[12, 24, 40].map(n => `<option ${n === 24 ? 'selected' : ''}>${n}</option>`).join('')}</select></label>`;
  const go = `<button class="btn" id="goBtn">${esc(t('go'))}</button>`;
  const ex = excluded().length ? `<p class="note">${esc(t('excluded', excluded().length))} · <button class="mini" id="clearEx">${esc(t('clearEx'))}</button></p>` : '';
  if (mode === 'discover') {
    const y = new Date().getUTCFullYear(), y0 = meta.registered ? new Date(meta.registered * 1000).getUTCFullYear() : y - 10;
    const extra = kind === 'artist' ? `<label class="f"><span>${esc(t('tArtist'))}</span><input type="text" id="optArtist" placeholder="${esc(t('artistPh'))}"></label>`
      : kind === 'tags' ? `<label class="f"><span>${esc(t('tTags'))}</span><input type="text" id="optTags" placeholder="${esc(t('tagsPh'))}"></label>`
      : kind === 'era' ? `<label class="f"><span>${esc(t('eraFrom'))}</span><input type="number" id="optY0" min="${y0}" max="${y}" value="${y0}"></label><label class="f"><span>${esc(t('eraTo'))}</span><input type="number" id="optY1" min="${y0}" max="${y}" value="${Math.min(y, y0 + 3)}"></label>` : '';
    box.innerHTML = `<div class="form"><div><div class="muted small" style="margin-bottom: 8px">${esc(t('theme'))}</div><div class="seg">${['none', 'artist', 'tags', 'era'].map(k => `<button data-kind="${k}" aria-pressed="${k === kind}">${esc(t({ none: 'tNone', artist: 'tArtist', tags: 'tTags', era: 'tEra' }[k]))}</button>`).join('')}</div></div><div class="opts">${extra}${countSel}${go}</div>${ex}</div>`;
    box.querySelectorAll('[data-kind]').forEach(b => b.addEventListener('click', () => { kind = b.dataset.kind; renderOpts(); }));
  } else if (mode === 'forgotten') {
    box.innerHTML = `<div class="opts">${countSel}${go}</div>${ex}`;
  } else if (mode === 'loved') {
    box.innerHTML = `<div class="opts"><label class="f"><span>${esc(t('moodLabel'))}</span><input type="text" id="optTags" placeholder="${esc(t('moodPh'))}"></label>${countSel}${go}</div>${ex}`;
  } else {
    box.innerHTML = '';
    box.hidden = true; renderStats(); return;
  }
  box.hidden = false;
  $('#goBtn').addEventListener('click', run);
  const ce = $('#clearEx'); if (ce) ce.addEventListener('click', () => { store.set(exKey(), []); renderOpts(); });
}

async function run() {
  if (running) return;
  running = true; cancelled = false; failedCalls = 0;
  const opt = { count: +$('#optCount').value, kind };
  const tagsIn = $('#optTags'); opt.tags = tagsIn ? tagsIn.value.split(',').map(s => s.trim().toLowerCase()).filter(Boolean) : [];
  if ($('#optArtist')) opt.artist = $('#optArtist').value.trim();
  if ($('#optY0')) { opt.y0 = +$('#optY0').value; opt.y1 = +$('#optY1').value; if (opt.y1 < opt.y0) [opt.y0, opt.y1] = [opt.y1, opt.y0]; }
  if (kind === 'artist' && !opt.artist) opt.kind = 'none';
  if (kind === 'tags' && !opt.tags.length) opt.kind = 'none';
  $('#results').innerHTML = ''; $('#runBox').hidden = false; $('#goBtn').disabled = true;
  const logEl = $('#runLog'); logEl.innerHTML = '';
  const log = m => { logEl.querySelectorAll('li').forEach(li => li.classList.remove('now')); const li = document.createElement('li'); li.className = 'now'; li.textContent = m; logEl.appendChild(li); };
  const bar = f => { $('#runBar').style.width = Math.min(100, f * 100) + '%'; };
  bar(0);
  try {
    const fn = mode === 'discover' ? discover : mode === 'forgotten' ? forgotten : loved;
    lastResult = await fn(opt, log, bar);
    lastResult.failed = failedCalls;
    bar(1); $('#runBox').hidden = true;
    renderResult(lastResult);
  } catch (e) {
    $('#runBox').hidden = true;
    if (e.message !== 'cancelled') $('#results').innerHTML = `<p class="card err">${esc(t('errNet'))}</p>`;
  } finally { running = false; const g = $('#goBtn'); if (g) g.disabled = false; }
}
$('#stopBtn').addEventListener('click', () => { cancelled = true; });

const spotifyUrl = r => 'https://open.spotify.com/search/' + encodeURIComponent(`${r.artist} ${r.track || ''}`.trim());
function renderResult(res) {
  const out = $('#results');
  if (!res.rows.length) { out.innerHTML = `<p class="card">${esc(res.mode === 'forgotten' ? t('noForgotten') : t('empty'))}</p>`; return; }
  let head = '', cols = '', body = '';
  const n = res.rows.length;
  const actions = r => `<div class="row-actions"><a class="mini" href="${spotifyUrl(r)}" target="_blank" rel="noopener">${esc(t('spotify'))} ↗</a><button class="mini" data-know="${esc(r.artist)}">${esc(t('known'))}</button></div>`;
  if (res.mode === 'discover') {
    const sub = res.path === 'B' ? `<div class="tags">${(res.cluster || []).map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div><p class="note" style="margin: 8px 0 0">${esc(t('pathB'))}</p>`
      : res.path === 'artist' ? `<p class="note">${esc(t('pathArtist', res.artistName))}</p>` : res.path === 'tags' ? `<p class="note">${esc(t('pathTags', res.tags.join(', ')))}</p>`
      : res.path === 'era' ? `<p class="note">${esc(t('pathEra', res.era))}</p>` : '';
    head = `<div class="big"><b class="num">${n}</b><em>${esc(t('resNew'))}</em><b class="z">0</b><em>${esc(t('resPlays'))}</em></div>${sub}`;
    cols = `<th>${esc(t('hArtist'))}</th><th>${esc(t('hSimilar'))}</th><th class="r">${esc(t('hListeners'))}</th><th class="r">${esc(t('hYour'))}</th><th></th>`;
    body = res.rows.map(r => `<tr><td class="a">${esc(r.artist)}<span class="sub">${esc(r.track)}</span></td><td>${esc(r.similar.join(', '))}</td><td class="r num">${fmt(r.listeners)}</td><td class="r"><span class="zero-cell">0</span></td><td>${actions(r)}</td></tr>`).join('');
  } else if (res.mode === 'forgotten') {
    head = `<div class="big"><b class="num">${n}</b><em>${esc(t('resForgotten'))}</em></div>`;
    cols = `<th>${esc(t('hArtist'))}</th><th class="r">${esc(t('hTotal'))}</th><th class="r">${esc(t('hLast'))}</th><th></th>`;
    body = res.rows.map(r => `<tr><td class="a">${esc(r.artist)}<span class="sub">${esc(r.track || '')}</span></td><td class="r num">${fmt(r.total)}</td><td class="r num">${esc(r.last)}</td><td>${actions(r)}</td></tr>`).join('');
  } else {
    const tg = res.tags ? `<div class="tags">${res.tags.map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div>` : '';
    head = `<div class="big"><b class="num">${n}</b><em>${esc(t('resLoved'))}</em></div>${tg}`;
    cols = `<th>${esc(t('hArtist'))}</th><th class="r">${esc(t('hPlays'))}</th><th></th>`;
    body = res.rows.map(r => `<tr><td class="a">${esc(r.artist)}<span class="sub">${esc(r.track || '')}${r.trackPlays ? ' · ' + fmt(r.trackPlays) : ''}</span></td><td class="r num">${fmt(r.plays)}</td><td>${actions(r)}</td></tr>`).join('');
  }
  const notes = [res.low ? t('lowData') : '', res.second ? t('secondLevel') : '', res.failed ? t('failedCalls', res.failed) : '', res.mode === 'discover' ? t('noteSpotify') : ''].filter(Boolean);
  out.innerHTML = `<div class="card" style="display: grid; gap: 18px">
    <div class="res-head"><div>${head}</div><button class="btn ghost" id="copyBtn">${esc(t('copy'))}</button></div>
    <div class="tablebox"><table><thead><tr>${cols}</tr></thead><tbody>${body}</tbody></table></div>
    ${notes.map(x => `<p class="note" style="margin: 0">${esc(x)}</p>`).join('')}</div>`;
  out.querySelectorAll('[data-know]').forEach(b => b.addEventListener('click', () => {
    exclude(b.dataset.know); res.rows = res.rows.filter(r => r.artist !== b.dataset.know); renderResult(res);
    const ex = document.querySelector('#opts .note'); if (!ex) renderOpts();
  }));
  $('#copyBtn').addEventListener('click', async () => {
    const text = res.rows.map(r => `${r.artist} — ${r.track || ''}`).join('\n');
    try { await navigator.clipboard.writeText(text); $('#copyBtn').textContent = t('copied'); }
    catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch {} ta.remove(); $('#copyBtn').textContent = t('copied'); }
  });
}

/* ------------------------------------------------------------------ stats */
function renderStats() {
  const perYear = new Map(), yearArt = new Map();
  for (const [l, chart] of Object.entries(months)) {
    const y = l.slice(0, 4);
    for (const [a, n] of Object.entries(chart)) {
      perYear.set(y, (perYear.get(y) || 0) + n);
      if (!yearArt.has(y)) yearArt.set(y, new Map()); const m = yearArt.get(y); m.set(a, (m.get(a) || 0) + n);
    }
  }
  const years = [...perYear.keys()].sort();
  const { allt } = playTables(6);
  const total = userInfo ? +userInfo.playcount : sumMap(allt);
  const since = meta.registered ? new Date(meta.registered * 1000).getUTCFullYear() : years[0];
  // bar chart, single series, one hue
  const W = Math.round(Math.min(960, Math.max(320, ($('#results').clientWidth || 960) - 50))), H = W < 600 ? 220 : 280, padL = 56, padB = 34, padT = 12;
  const max = Math.max(...years.map(y => perYear.get(y)), 1);
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); const m = max / p; return (m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; })();
  const bw = (W - padL - 8) / years.length, sy = v => H - padB - (v / nice) * (H - padB - padT);
  const ticks = [0, .25, .5, .75, 1].map(f => f * nice);
  const step = Math.ceil(years.length / Math.max(3, Math.floor((W - padL) / 64)));
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('sPerYear'))}">
    ${ticks.map(v => `<line x1="${padL}" x2="${W}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" stroke-width="1"/><text x="${padL - 8}" y="${sy(v) + 4}" text-anchor="end" font-size="12" fill="var(--muted)">${fmt(v)}</text>`).join('')}
    ${years.map((y, i) => { const v = perYear.get(y), x = padL + i * bw + 2, w = Math.max(2, bw - 4), top = sy(v), h = H - padB - top;
      return `<path d="M${x},${H - padB} V${top + Math.min(4, h)} Q${x},${top} ${x + Math.min(4, w / 2)},${top} H${x + w - Math.min(4, w / 2)} Q${x + w},${top} ${x + w},${top + Math.min(4, h)} V${H - padB} Z" fill="var(--cobalt)"/>
      <rect x="${padL + i * bw}" y="${padT}" width="${bw}" height="${H - padB - padT}" fill="transparent" data-y="${y}" data-v="${v}"/>
      ${i % step === 0 ? `<text x="${x + w / 2}" y="${H - 12}" text-anchor="middle" font-size="12" fill="var(--muted)">${y}</text>` : ''}`; }).join('')}
  </svg>`;
  const top = (m, k) => { const arr = [...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, k); const mx = arr.length ? arr[0][1] : 1;
    return `<ol class="toplist">${arr.map(([a, v]) => `<li><i style="width: ${v / mx * 100}%"></i><span>${esc(a)}</span><b class="num">${fmt(v)}</b></li>`).join('')}</ol>`; };
  const yOpts = [`<option value="all">${esc(t('sAllTime'))}</option>`, ...years.slice().reverse().map(y => `<option>${y}</option>`)].join('');
  $('#results').innerHTML = `<div style="display: grid; gap: 20px">
    <div class="kpis"><div class="card kpi"><b class="num">${fmt(total)}</b><span>${esc(t('sTotal'))}</span></div>
      <div class="card kpi"><b class="num">${fmt(allt.size)}</b><span>${esc(t('sArtists'))}</span></div>
      <div class="card kpi"><b class="num">${since}</b><span>${esc(t('sSince'))} · ${years.length}</span></div></div>
    <div class="card"><h3 style="font-size: 18px; margin-bottom: 14px">${esc(t('sPerYear'))}</h3><div class="chart" id="chart">${svg}<div class="tip" id="tip" hidden></div></div></div>
    <div class="card"><div style="display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px"><h3 style="font-size: 18px">${esc(t('sTop'))}</h3>
      <select id="yearSel" style="width: auto; min-width: 160px" aria-label="${esc(t('sTop'))}">${yOpts}</select></div><div id="topBox">${top(allt, 15)}</div></div></div>`;
  $('#yearSel').addEventListener('change', e => { const v = e.target.value; $('#topBox').innerHTML = top(v === 'all' ? allt : yearArt.get(v), 15); });
  const chart = $('#chart'), tip = $('#tip');
  chart.querySelectorAll('rect[data-y]').forEach(r => {
    r.addEventListener('mouseenter', () => { const b = r.getBoundingClientRect(), c = chart.getBoundingClientRect(); tip.textContent = `${r.dataset.y}: ${fmt(r.dataset.v)}`; tip.style.left = (b.left - c.left + b.width / 2) + 'px'; tip.style.top = (b.top - c.top + 40) + 'px'; tip.hidden = false; });
    r.addEventListener('mouseleave', () => { tip.hidden = true; });
  });
}

/* ------------------------------------------------------------------ boot */
window.__unheard = { norm, monthRanges, forgottenPool: () => forgottenPool() };
paintText();
if (creds) start(); else show('setup');
})();
